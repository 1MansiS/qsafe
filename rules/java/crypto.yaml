rules:
  - id: java-rsa-keypairgen
    patterns:
      - pattern: KeyPairGenerator.getInstance("RSA")
      - pattern: KeyPairGenerator.getInstance("RSA", ...)
    message: RSA key pair generation detected. RSA is vulnerable to quantum attacks (Shor's algorithm). Migrate to ML-KEM-768 (FIPS 203).
    languages: [java]
    severity: WARNING
    metadata:
      primitive: RSA
      usage: key_generation
      cwe: CWE-327

  - id: java-rsa-cipher
    pattern: Cipher.getInstance("RSA/...")
    message: RSA encryption detected. RSA is quantum-vulnerable. Migrate to ML-KEM-768 (FIPS 203).
    languages: [java]
    severity: WARNING
    metadata:
      primitive: RSA
      usage: encryption

  - id: java-ecdh
    pattern: KeyAgreement.getInstance("ECDH")
    message: ECDH key agreement detected. ECC is quantum-vulnerable. Migrate to ML-KEM (FIPS 203).
    languages: [java]
    severity: WARNING
    metadata:
      primitive: ECDH
      usage: key_agreement

  - id: java-ecdsa
    patterns:
      - pattern: Signature.getInstance("SHA256withECDSA")
      - pattern: Signature.getInstance("SHA384withECDSA")
      - pattern: Signature.getInstance("SHA512withECDSA")
    message: ECDSA signature detected. ECC is quantum-vulnerable. Migrate to ML-DSA-65 (FIPS 204).
    languages: [java]
    severity: WARNING
    metadata:
      primitive: ECDSA
      usage: signing

  - id: java-aes-ecb-explicit
    pattern: Cipher.getInstance("AES/ECB/...")
    message: AES in ECB mode detected. ECB mode leaks plaintext patterns. Use AES-256-GCM instead.
    languages: [java]
    severity: WARNING
    metadata:
      primitive: AES-ECB
      usage: encryption

  - id: java-aes-default-ecb
    pattern: Cipher.getInstance("AES")
    message: AES with no mode specified defaults to ECB on most JVMs. Explicitly use AES-256-GCM.
    languages: [java]
    severity: WARNING
    metadata:
      primitive: AES-ECB
      usage: encryption

  - id: java-3des
    patterns:
      - pattern: Cipher.getInstance("DESede/...")
      - pattern: Cipher.getInstance("DESede")
    message: Triple DES (3DES) detected. 3DES is deprecated (NIST SP 800-131A). Replace with AES-256-GCM.
    languages: [java]
    severity: WARNING
    metadata:
      primitive: 3DES
      usage: encryption

  - id: java-rc4
    patterns:
      - pattern: Cipher.getInstance("RC4")
      - pattern: Cipher.getInstance("ARCFOUR")
    message: RC4 stream cipher detected. RC4 is cryptographically broken. Replace with AES-256-GCM.
    languages: [java]
    severity: ERROR
    metadata:
      primitive: RC4
      usage: encryption

  - id: java-md5
    pattern: MessageDigest.getInstance("MD5")
    message: MD5 hash detected. MD5 is collision-broken. Use SHA-256 or SHA-3.
    languages: [java]
    severity: WARNING
    metadata:
      primitive: MD5
      usage: hashing

  - id: java-sha1-digest
    patterns:
      - pattern: MessageDigest.getInstance("SHA-1")
      - pattern: MessageDigest.getInstance("SHA1")
    message: SHA-1 hash detected. SHA-1 is deprecated for cryptographic use (NIST). Use SHA-256 or SHA-3.
    languages: [java]
    severity: WARNING
    metadata:
      primitive: SHA-1
      usage: hashing

  - id: java-sha1withrsa
    patterns:
      - pattern: Signature.getInstance("SHA1withRSA")
      - pattern: Signature.getInstance("MD5withRSA")
    message: Signature algorithm with weak hash detected. Use SHA-256 or stronger, and migrate RSA to ML-DSA (FIPS 204).
    languages: [java]
    severity: WARNING
    metadata:
      primitive: RSA
      usage: signing

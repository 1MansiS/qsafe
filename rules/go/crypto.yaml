rules:
  - id: go-rsa-key-gen
    pattern: rsa.GenerateKey(...)
    message: RSA key generation detected. RSA is quantum-vulnerable. Migrate to ML-KEM (FIPS 203).
    languages: [go]
    severity: WARNING
    metadata:
      primitive: RSA
      usage: key_generation

  - id: go-rsa-encrypt
    patterns:
      - pattern: rsa.EncryptPKCS1v15(...)
      - pattern: rsa.EncryptOAEP(...)
    message: RSA encryption detected. RSA is quantum-vulnerable. Migrate to ML-KEM (FIPS 203).
    languages: [go]
    severity: WARNING
    metadata:
      primitive: RSA
      usage: encryption

  - id: go-rsa-sign
    patterns:
      - pattern: rsa.SignPKCS1v15(...)
      - pattern: rsa.SignPSS(...)
    message: RSA signing detected. RSA is quantum-vulnerable. Migrate to ML-DSA (FIPS 204).
    languages: [go]
    severity: WARNING
    metadata:
      primitive: RSA
      usage: signing

  - id: go-ecdsa
    patterns:
      - pattern: ecdsa.GenerateKey(...)
      - pattern: ecdsa.Sign(...)
      - pattern: ecdsa.SignASN1(...)
    message: ECDSA key/signature operation detected. ECDSA is quantum-vulnerable. Migrate to ML-DSA-65 (FIPS 204).
    languages: [go]
    severity: WARNING
    metadata:
      primitive: ECDSA
      usage: signing

  - id: go-des
    patterns:
      - pattern: des.NewCipher(...)
      - pattern: des.NewTripleDESCipher(...)
    message: DES/3DES cipher detected. These are deprecated. Replace with AES-256-GCM.
    languages: [go]
    severity: WARNING
    metadata:
      primitive: 3DES
      usage: encryption

  - id: go-rc4
    pattern: rc4.NewCipher(...)
    message: RC4 cipher detected. RC4 is cryptographically broken. Replace with AES-256-GCM.
    languages: [go]
    severity: ERROR
    metadata:
      primitive: RC4
      usage: encryption

  - id: go-md5
    patterns:
      - pattern: md5.New()
      - pattern: md5.Sum(...)
    message: MD5 hash detected. MD5 is collision-broken. Use sha256.New() or sha3.New256().
    languages: [go]
    severity: WARNING
    metadata:
      primitive: MD5
      usage: hashing

  - id: go-sha1
    patterns:
      - pattern: sha1.New()
      - pattern: sha1.Sum(...)
    message: SHA-1 hash detected. SHA-1 is deprecated. Use sha256.New().
    languages: [go]
    severity: WARNING
    metadata:
      primitive: SHA-1
      usage: hashing
